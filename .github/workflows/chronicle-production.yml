name: Chronicle Production

on:
  push:
    branches:
      - main
      - chronicle-generator-rss
    paths:
      - "scripts/**"
      - "content/chronicle/**"
      - ".github/workflows/chronicle-production.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-production:
    name: Build Chronicle Pages and RSS
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate generator
        run: python -m py_compile scripts/build-chronicle.py

      - name: Remove stale generated Chronicle files
        run: |
          find chronicle -mindepth 1 -maxdepth 1 ! -name README.md -exec rm -rf {} +

      - name: Build Chronicle production files
        run: python scripts/build-chronicle.py --output-dir chronicle

      - name: Verify production publication rules
        run: |
          python - <<'PY'
          from pathlib import Path

          def issue_status(path: Path) -> str:
              in_front_matter = False
              for raw in path.read_text(encoding="utf-8").splitlines():
                  line = raw.strip()
                  if line == "---":
                      in_front_matter = not in_front_matter
                      continue
                  if in_front_matter and line.lower().startswith("status:"):
                      return line.split(":", 1)[1].strip().strip("\"'").lower()
              raise SystemExit(f"Missing status in {path}")

          output = Path("chronicle")
          feed_path = output / "feed.xml"
          index_path = output / "index.html"

          if not index_path.is_file():
              raise SystemExit("Missing chronicle/index.html")
          if not feed_path.is_file():
              raise SystemExit("Missing chronicle/feed.xml")

          feed = feed_path.read_text(encoding="utf-8")

          for source in sorted(Path("content/chronicle").glob("*.md")):
              if source.name.startswith("_") or source.name.lower() == "readme.md":
                  continue
              slug = source.stem
              status = issue_status(source)
              page = output / slug / "index.html"

              if status == "draft":
                  if page.exists():
                      raise SystemExit(f"Draft issue was generated in production: {slug}")
                  if slug in feed:
                      raise SystemExit(f"Draft issue leaked into RSS: {slug}")
              elif status == "published":
                  if not page.is_file():
                      raise SystemExit(f"Published issue page missing: {slug}")

          print("PASS: production contains only published issue pages and excludes drafts from RSS.")
          PY

      - name: Commit generated Chronicle files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- chronicle/
          if git diff --cached --quiet; then
            echo "No generated Chronicle changes to commit."
            exit 0
          fi
          git commit -m "Build Chronicle pages and RSS"
          git push
